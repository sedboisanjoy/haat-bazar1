spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.mvc.routes[1].id=product-service
spring.cloud.gateway.mvc.routes[1].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/products/**

spring.cloud.gateway.mvc.routes[2].id=inventory-service
spring.cloud.gateway.mvc.routes[2].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/inventory/**

spring.cloud.gateway.mvc.routes[3].id=order-service
spring.cloud.gateway.mvc.routes[3].uri=lb://ORDER-SERVICE
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.mvc.routes[4].id=cart-service
spring.cloud.gateway.mvc.routes[4].uri=lb://ORDER-SERVICE
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/cart/**

spring.cloud.gateway.mvc.routes[5].id=payment-service
spring.cloud.gateway.mvc.routes[5].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.mvc.routes[6].id=categories-service
spring.cloud.gateway.mvc.routes[6].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.mvc.routes[6].predicates[0]=Path=/api/categories/**

spring.cloud.gateway.mvc.routes[7].id=backup-service
spring.cloud.gateway.mvc.routes[7].uri=lb://BACKUP-SERVICE
spring.cloud.gateway.mvc.routes[7].predicates[0]=Path=/api/backup/**
