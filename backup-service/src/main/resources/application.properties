spring.application.name=BACKUP-SERVICE
server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/backup_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=haatbazar
spring.datasource.password=haatbazar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

jwt.secret=HaatBazarSuperSecretKeyWhichIsAtLeast256BitsLongForSecurityPurpose

# --- Backup configuration ---
backup.directory=/tmp/haat-bazar-backups
backup.databases=auth_db,product_db,order_db,payment_db
backup.schedule=0 0 * * * *

# DB connection for mysqldump (usually same host as this service's datasource)
backup.db.host=localhost
backup.db.port=3306
backup.db.username=haatbazar
backup.db.password=haatbazar
