server.port=8084
spring.application.name=ORDER-SERVICE

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=haatbazar
spring.datasource.password=haatbazar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Inventory Service URL (Sajib's service — stock at /api/inventory/{productId})
inventory.service.url=${INVENTORY_SERVICE_URL:http://localhost:8082}

jwt.secret=HaatBazarSuperSecretKeyWhichIsAtLeast256BitsLongForSecurityPurpose
